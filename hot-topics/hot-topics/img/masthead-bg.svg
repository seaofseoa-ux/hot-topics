<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12312C"/>
      <stop offset="100%" stop-color="#1B5E5A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#mh-bg)"/>
  <!-- ledger rule lines -->
  <g stroke="#F4F1E6" stroke-opacity="0.08" stroke-width="2">
    <line x1="0" y1="70" x2="1600" y2="70"/>
    <line x1="0" y1="140" x2="1600" y2="140"/>
    <line x1="0" y1="210" x2="1600" y2="210"/>
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="350" x2="1600" y2="350"/>
    <line x1="0" y1="420" x2="1600" y2="420"/>
  </g>
  <!-- margin rule -->
  <line x1="140" y1="0" x2="140" y2="500" stroke="#7FB069" stroke-opacity="0.35" stroke-width="3"/>
  <!-- coin cluster motif, echoed in article-money.svg -->
  <g transform="translate(1180,250)">
    <circle r="150" fill="#7FB069" fill-opacity="0.12"/>
    <circle r="96" fill="none" stroke="#F4F1E6" stroke-opacity="0.55" stroke-width="4"/>
    <circle r="96" fill="none" stroke="#7FB069" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#F4F1E6" fill-opacity="0.7">$</text>
    <circle cx="-190" cy="-70" r="46" fill="none" stroke="#F4F1E6" stroke-opacity="0.3" stroke-width="3"/>
    <circle cx="200" cy="120" r="30" fill="none" stroke="#F4F1E6" stroke-opacity="0.25" stroke-width="3"/>
  </g>
</svg>
